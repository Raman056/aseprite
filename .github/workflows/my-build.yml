name: my-build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SKIA_VERSION: m124-08a5439a6b
  SKIA_URL_BASE: https://github.com/aseprite/skia/releases/download

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------------------
      # Common tooling
      # ---------------------------------------------------------------
      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Setup MSVC dev environment (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ libgtk-3-dev libcurl4-openssl-dev \
            libx11-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev

      # ---------------------------------------------------------------
      # Skia (prebuilt, matches Aseprite's expected version)
      # ---------------------------------------------------------------
      - name: Download prebuilt Skia (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -Lo skia.zip "$SKIA_URL_BASE/$SKIA_VERSION/Skia-Windows-Release-x64.zip"
          mkdir -p deps/skia
          unzip -q skia.zip -d deps/skia

      - name: Download prebuilt Skia (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -Lo skia.zip "$SKIA_URL_BASE/$SKIA_VERSION/Skia-macOS-Release-arm64.zip"
          mkdir -p deps/skia
          unzip -q skia.zip -d deps/skia

      - name: Download prebuilt Skia (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -Lo skia.zip "$SKIA_URL_BASE/$SKIA_VERSION/Skia-Linux-Release-x64-libstdc++.zip"
          mkdir -p deps/skia
          unzip -q skia.zip -d deps/skia

      # ---------------------------------------------------------------
      # Configure + build
      # ---------------------------------------------------------------
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DLAF_BACKEND=skia ^
            -DSKIA_DIR=%CD%\deps\skia ^
            -DSKIA_LIBRARY_DIR=%CD%\deps\skia\out\Release-x64 ^
            -DSKIA_LIBRARY=%CD%\deps\skia\out\Release-x64\skia.lib

      - name: Configure (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$PWD/deps/skia \
            -DSKIA_LIBRARY_DIR=$PWD/deps/skia/out/Release-x64 \
            -DSKIA_LIBRARY=$PWD/deps/skia/out/Release-x64/libskia.a

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      # ---------------------------------------------------------------
      # Package a self-extracting .sh installer (Linux / Arch + Hyprland)
      # ---------------------------------------------------------------
      - name: Build self-extracting installer
        if: runner.os == 'Linux'
        run: |
          set -e
          PKG=dist
          mkdir -p "$PKG"

          cat > "$PKG/install.sh" << 'HEADER'
#!/usr/bin/env bash
set -e

APP_NAME="aseprite"
INSTALL_DIR="$HOME/.local/share/$APP_NAME"
BIN_DIR="$HOME/.local/bin"
DESKTOP_DIR="$HOME/.local/share/applications"

echo "Installing $APP_NAME to $INSTALL_DIR ..."
mkdir -p "$INSTALL_DIR" "$BIN_DIR" "$DESKTOP_DIR"

ARCHIVE_LINE=$(awk '/^__PAYLOAD_BELOW__/ {print NR + 1; exit 0}' "$0")
tail -n +"$ARCHIVE_LINE" "$0" | tar xz -C "$INSTALL_DIR"

chmod +x "$INSTALL_DIR/aseprite"
ln -sf "$INSTALL_DIR/aseprite" "$BIN_DIR/aseprite"

cat > "$DESKTOP_DIR/aseprite.desktop" << DESKTOP
[Desktop Entry]
Name=Aseprite
Comment=Animated sprite editor & pixel art tool
Exec=$BIN_DIR/aseprite %f
Terminal=false
Type=Application
Categories=Graphics;2DGraphics;RasterGraphics;
DESKTOP

echo ""
echo "Done."
echo "Make sure \$HOME/.local/bin is in your PATH (add to ~/.bashrc or ~/.zshrc if not):"
echo "  export PATH=\"\$HOME/.local/bin:\$PATH\""
echo "Launch it from your Hyprland launcher (wofi/rofi/fuzzel) as 'Aseprite', or run 'aseprite' in a terminal."

exit 0
__PAYLOAD_BELOW__
HEADER

          tar czf - -C build/bin . >> "$PKG/install.sh"
          chmod +x "$PKG/install.sh"

      - name: Upload installer artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-arch-installer
          path: dist/install.sh
          if-no-files-found: warn
